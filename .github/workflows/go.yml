name: Go CI

env:
  DOCKER_IMAGE_VERSION: "003"

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up job container
        run: |
          docker image pull leonamsimoes/projects:totp_code_generator_${{ env.DOCKER_IMAGE_VERSION }}
      - name: Test
        run: |
          echo WORKSPACE ${{ github.workspace }}
          docker run --rm -d leonamsimoes/projects:totp_code_generator_${{ env.DOCKER_IMAGE_VERSION }} make test
      - name: Lint
        run: |
          docker run --rm -d leonamsimoes/projects:totp_code_generator_${{ env.DOCKER_IMAGE_VERSION }} make lint
      - name: Mutation
        run: |
          docker run --rm -d leonamsimoes/projects:totp_code_generator_${{ env.DOCKER_IMAGE_VERSION }} make mutation